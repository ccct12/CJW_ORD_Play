<style>/* 원랜디 화면 — 나루토 랜디(CJW_NRD)와 같은 디자인으로 통일(2026-11-11).
   전장 전체화면 · 왼쪽 정보 · 오른쪽 아래 3×3 명령 카드 · 가운데 창. 어두운 남색 유리판 + 주황·하늘색 강조.
   원피스 포인트 색: 밀짚 노랑(--gold2)·바다 하늘색(--chak). (만화풍 이전 판: git 기록 참고) */
:root {
  --bg:#070a14; --card:#141a2e; --card2:#0e1324; --line:#26304f; --line2:#34406a; --gold:#ffb43a; --gold2:#ffd27a; --txt:#eef2ff; --dim:#8e98bd;
  --acc:#ff7a1a; --acc2:#ff4d1a; --good:#35e08a; --bad:#ff4d5e; --chak:#4cc3ff; --mp:#3a8aff; --red:#ff4d5e;
  --frame:0 0 0 1px var(--line), inset 0 1px 0 #ffffff10; --glass:linear-gradient(160deg,#141b33c7,#0a0f1ec7); --r:14px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; color:var(--txt); background:var(--bg); overscroll-behavior:none; -webkit-user-select:none; user-select:none; letter-spacing:-.01em;
  font:14px/1.35 "Pretendard","Noto Sans KR","Noto Sans JP","Noto Sans SC",system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif; touch-action:none; }
.svg { width:1.3em; height:1.3em; display:block; flex:none; }
button { font:inherit; font-weight:700; color:var(--txt); background:linear-gradient(170deg,#222b4a,#141a30); border:none; box-shadow:var(--frame), 0 3px 8px #0006; border-radius:12px; padding:6px 12px; min-height:38px; cursor:pointer; transition:transform .08s, filter .15s, box-shadow .15s; }
button:hover { filter:brightness(1.12); }
button:active { transform:translateY(1px) scale(.97); filter:brightness(1.25); }
button:disabled, button.off { opacity:.35; filter:grayscale(.7); cursor:default; box-shadow:var(--frame); } button:disabled:active { transform:none; }
button:focus-visible { outline:2px solid var(--chak); outline-offset:2px; }
button.pri { background:linear-gradient(160deg,#ffae45,#ff6a1a 60%,#e8461a); color:#fff; font-weight:800; text-shadow:0 1px 1px #8a2a0066; box-shadow:0 0 0 1px #ffc27a66, 0 4px 14px #ff6a1a55; }
button.danger { background:linear-gradient(160deg,#ff6a7a,#e8253a); color:#fff; font-weight:800; box-shadow:0 0 0 1px #ff9aa566, 0 4px 14px #e8253a55; }
.pane { background:var(--glass); box-shadow:0 0 0 1px var(--line2), inset 0 1px 0 #ffffff12, 0 6px 18px #000a; border-radius:var(--r); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.dim { color:var(--dim); font-weight:500; } .empty { text-align:center; color:var(--dim); padding:28px 10px; font-size:14px; line-height:1.6; }
kbd { font:700 9.5px/1 ui-monospace,monospace; margin-left:4px; padding:2px 3px; border-radius:4px; color:#cfd6f5; background:#00000080; box-shadow:inset 0 0 0 1px #ffffff26; }
body.touch kbd { display:none; }

/* ── 전장 ── */
#app { position:fixed; inset:0; }
#stage { position:absolute; inset:0; background:#1d5f8f; overflow:hidden; }
#bg, #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#bg { pointer-events:none; background:#1d5f8f; }
#msgs { position:absolute; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 8px); width:min(40vw,460px); text-align:center; font-size:12px; font-weight:600; pointer-events:none; z-index:4; color:#fff; text-shadow:0 1px 2px #000; }
#msgs div { margin:3px auto 0; width:fit-content; max-width:100%; padding:3px 12px; border-radius:12px; background:#0a0f22d9; box-shadow:0 0 0 1px var(--line2); backdrop-filter:blur(6px); text-shadow:none; }
#banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; opacity:0; transition:opacity .5s, transform .5s cubic-bezier(.2,1.4,.4,1); transform:scale(.85); z-index:6; }
#banner.on { opacity:1; transform:none; }
#banner b { display:inline-block; font-size:26px; font-weight:900; padding:10px 30px; color:#fff; background:linear-gradient(90deg,#0000,#0a0f22e6 15%,#0a0f22e6 85%,#0000); text-shadow:0 2px 0 #000,0 0 18px #ff7a1a; letter-spacing:2px; border-top:2px solid; border-bottom:2px solid; border-image:linear-gradient(90deg,transparent,var(--acc),var(--chak),transparent) 1; }
#banner span { display:block; font-size:12px; color:var(--gold2); margin-top:5px; text-shadow:0 1px 2px #000; }

/* ── 양옆 ── */
#lside, #rside { position:absolute; top:0; bottom:0; z-index:10; display:flex; flex-direction:column; gap:6px; min-height:0; pointer-events:none;
  width:clamp(190px,26vw,320px); padding:calc(env(safe-area-inset-top) + 6px) 6px calc(env(safe-area-inset-bottom) + 6px); }
#lside { left:0; padding-left:calc(env(safe-area-inset-left) + 6px); }
#rside { right:0; padding-right:calc(env(safe-area-inset-right) + 6px); }
#lside > *, #rside > * { pointer-events:auto; }

/* HUD: 라운드 엠블럼 + 단계 + 남은 적 */
#hud { flex:none; display:flex; align-items:center; gap:8px; padding:5px 8px; position:relative; overflow:hidden; }
#hud::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,transparent,var(--acc),var(--chak),transparent); opacity:.9; }
#hud .emb { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; align-content:center; background:linear-gradient(145deg,#ffb04a,#ff6a1a 55%,#d23a10); color:#fff; box-shadow:0 0 0 2px #ffffff22, 0 6px 16px #ff6a1a66; font-weight:900; line-height:1; text-shadow:0 1px 2px #0006; }
#hud .emb b { font-size:16px; } #hud .emb small { font-size:8.5px; font-weight:700; margin-top:2px; opacity:.9; }
#hud .mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
#hud .row1 { display:flex; align-items:center; gap:6px; font-size:11.5px; white-space:nowrap; overflow:hidden; }
.tag { font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:800; white-space:nowrap; color:#fff; background:linear-gradient(90deg,#4c6bff,#8a4dff); letter-spacing:.02em; }
.wave { font-weight:800; overflow:hidden; text-overflow:ellipsis; color:var(--txt); }
#hud .enm { flex:none; text-align:right; font-size:11px; color:var(--dim); line-height:1.15; }
#hud .enm b { display:block; font-size:18px; font-weight:900; color:var(--txt); font-variant-numeric:tabular-nums; }
#hud .enm.danger b { color:var(--bad); animation:pulse .6s infinite alternate; }
@keyframes pulse { to { text-shadow:0 0 12px #ff2a3a; } }
.bar { height:7px; background:#05070f; border-radius:20px; overflow:hidden; position:relative; box-shadow:inset 0 1px 2px #000; }
.bar > i { position:absolute; inset:0 auto 0 0; display:block; border-radius:20px; background:linear-gradient(90deg,#4cc3ff,#8a7dff); box-shadow:0 0 8px #4cc3ff88; transition:width .25s; }
.bar.hp > i { background:linear-gradient(90deg,#35e08a,#1fb86a); box-shadow:0 0 8px #35e08a66; } .bar.mp > i { background:linear-gradient(90deg,#7cd8ff,#3a6aff); box-shadow:0 0 8px #4c9cff; }
.bar.boss > i, .bar.big.boss > i { background:linear-gradient(90deg,#e09bff,#8a3dd8); }
.bar.big { height:15px; } .bar.big b { position:relative; font-size:10px; padding-left:6px; line-height:15px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000; }

/* 도구 알약 */
#tools { flex:none; display:flex; flex-wrap:wrap; gap:4px; }
#tools button { min-height:34px; padding:3px 12px; font-size:12px; border-radius:18px; display:flex; align-items:center; gap:5px; background:#0d1222c7; }
#tools button .svg { width:16px; height:16px; }
#tools button.on { background:linear-gradient(145deg,#ffb04a,#ff6a1a); color:#fff; }
#tools kbd.hk { margin:0; }

/* 선택 카드 / 할 일 */
#sel { margin-top:auto; flex:0 1 auto; max-height:58%; overflow-y:auto; padding:8px; font-size:12px; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
#sel.none { background:none; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; padding:0; overflow:visible; }
.selh { display:flex; gap:10px; align-items:center; }
.selh > .big, .infoh > .big { width:48px; height:48px; border-radius:14px; flex:none; background:#0b1022; box-shadow:0 0 0 2px var(--tc,#4c6bff), 0 0 16px color-mix(in srgb, var(--tc,#4c6bff) 60%, transparent); }
.selh .info { flex:1; min-width:0; } .nm { font-size:15px; font-weight:800; line-height:1.2; } .nm small { color:var(--gold2); font-weight:800; }
.selh .bar { margin-top:4px; }
.tier { display:inline-block; font-size:10px; font-weight:800; padding:1px 7px; border-radius:20px; color:#fff; background:var(--tc); margin-bottom:2px; text-shadow:0 1px 1px #0008; }
.stats { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px; font-size:11.5px; color:var(--dim); }
.stats span { display:flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px; background:#ffffff08; box-shadow:inset 0 0 0 1px #ffffff10; }
.stats b { color:var(--txt); } .stats .svg { width:13px; height:13px; color:var(--gold); }
.btns { display:flex; gap:5px; margin:8px 0 2px; flex-wrap:wrap; } .btns button { min-height:32px; padding:4px 10px; font-size:12px; border-radius:10px; }
.sks { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:8px; }
.sk { position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 2px 3px; min-height:0; font-size:9.5px; line-height:1.1; border-radius:10px; }
.sk .ic { width:34px; height:34px; } .sk span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sk.pas { background:#0d1222; cursor:help; } .sk.pas:active { transform:none; filter:none; }
.sk .cd { position:absolute; top:3px; right:3px; font:800 10px/1 sans-serif; font-style:normal; color:#fff; background:#000a; padding:2px 3px; border-radius:4px; }
.sk kbd.hk { position:absolute; top:3px; left:3px; margin:0; }
.ic { width:38px; height:38px; flex:none; border-radius:8px; background:#0b1022; box-shadow:0 0 0 1px #ffffff22, 0 2px 6px #0008; display:inline-block; }
.mini { width:30px; height:30px; border-radius:7px; vertical-align:middle; background:#0b1022; box-shadow:0 0 0 1px #ffffff22; display:inline-block; flex:none; }
.mh { display:flex; align-items:baseline; gap:8px; } .mh b { font-size:14px; }
.selicons { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
.sg { position:relative; padding:2px; min-height:0; border-radius:11px; background:#0b1022; box-shadow:0 0 0 2px var(--tc,#4c6bff); }
.sg .mini { box-shadow:none; display:block; } .sg i { position:absolute; right:-6px; bottom:-6px; min-width:19px; height:19px; padding:0 4px; font:800 11px/19px sans-serif; font-style:normal; text-align:center; border-radius:10px; background:var(--acc); color:#fff; box-shadow:0 0 0 2px var(--bg); }
.todo { display:flex; flex-direction:column; align-items:flex-start; gap:5px; }
.todoh { font-size:11px; font-weight:900; color:var(--gold2); background:#0d1222d0; padding:2px 10px; border-radius:20px; box-shadow:0 0 0 1px var(--line2); }
.trow { display:flex; align-items:center; gap:7px; min-height:0; padding:4px 12px 4px 5px; border-radius:20px; font-size:12px; font-weight:600; text-align:left; background:#0d1222d0; box-shadow:0 0 0 1px var(--line2); color:var(--txt); }
.trow.wide { width:100%; margin-top:8px; border-radius:12px; }
.trow .ti { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(145deg,#ff8a2a33,#4cc3ff22); color:var(--gold2); flex:none; } .trow .ti .svg { width:14px; height:14px; }
.trow b { color:var(--gold2); }
.igrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; } .igrid.small { grid-template-columns:repeat(6,1fr); gap:4px; margin-top:8px; }
.islot { min-height:34px; border-radius:10px; box-shadow:inset 0 0 0 1px #ffffff14; background:#ffffff05; }
.islot.full { background:linear-gradient(160deg,#1b2342,#121830); box-shadow:var(--frame); padding:5px; position:relative; display:flex; flex-direction:column; gap:3px; font-size:11.5px; }
.igrid.small .islot.full { padding:1px; align-items:center; } .islot b { font-size:12px; } .islot i { position:absolute; top:3px; right:4px; font-style:normal; font-weight:800; font-size:11px; color:var(--gold2); }

/* 오른쪽 */
#res { flex:none; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px; }
.res { display:flex; align-items:center; gap:5px; padding:2px 8px 2px 3px; border-radius:20px; background:#0d1222c7; box-shadow:var(--frame); font-size:11.5px; }
.res .svg { width:16px; height:16px; padding:2px; border-radius:50%; background:#ffffff0d; } .res b { font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--txt); }
.res.gd .svg { color:#ffd84a; } .res.wd .svg { color:#d8a26a; } .res.fd .svg { color:var(--chak); }
#tbtns { flex:none; display:flex; gap:4px; justify-content:flex-end; }
#tbtns button { min-height:34px; padding:3px 10px; font-size:11.5px; border-radius:18px; display:flex; align-items:center; gap:5px; }
#tbtns button .svg { width:16px; height:16px; color:var(--gold2); }
#tbtns button.on { background:linear-gradient(145deg,#ffb04a,#ff6a1a); color:#fff; } #tbtns button.on .svg { color:#fff; }
#board { display:none !important; }
#combo { flex:none; display:none; align-self:flex-end; margin-top:auto; min-height:34px; padding:6px 12px; font-size:12px; border-radius:18px; align-items:center; gap:4px; animation:glow 1s infinite alternate; }
#combo.on { display:flex; }
@keyframes glow { from { box-shadow:var(--frame), 0 0 0 0 #ff7a1a00; } to { box-shadow:0 0 0 1px #ffb04a, 0 0 14px 2px #ff7a1a99; } }
#actions { flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:5px; }
#combo:not(.on) + #actions { margin-top:auto; }
#actions button { min-height:48px; padding:3px 2px; font-size:10.5px; font-weight:700; line-height:1.1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; }
#actions button .svg { width:21px; height:21px; color:var(--gold2); filter:drop-shadow(0 2px 4px #0008); }
#actions button.pri .svg { color:#fff; }
#actions .badge { position:absolute; top:-6px; right:-4px; min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:linear-gradient(#ff6a7a,#e8253a); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg), 0 2px 6px #e8253a88; }
#actions .badge:empty { display:none; }
#actions button.glow { animation:glow 1.1s infinite alternate; }
#actions kbd.hk { position:absolute; top:3px; left:4px; margin:0; }

/* 토스트 */
#toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 74px); transform:translateX(-50%) translateY(8px); z-index:30; background:#0b1022ee; backdrop-filter:blur(8px); color:var(--txt); box-shadow:0 0 0 1px var(--line2), 0 10px 30px #000c;
  padding:9px 18px; border-radius:24px; font-size:14px; font-weight:600; pointer-events:none; opacity:0; transition:opacity .2s, transform .25s cubic-bezier(.2,1.4,.4,1); max-width:90%; text-align:center; }
#toast.on { opacity:1; transform:translateX(-50%); }

/* ── 가운데 창 ── */
#panel { position:fixed; inset:0; z-index:20; display:none; background:#02040ab3; backdrop-filter:blur(4px); }
#panel.on { display:flex; align-items:center; justify-content:center; animation:fade .15s ease; }
@keyframes fade { from { opacity:0; } }
#sheet { width:min(600px,94vw); max-height:86dvh; display:flex; flex-direction:column; overflow:hidden; border-radius:20px; background:linear-gradient(170deg,#161d36f8,#0b0f1ef8); box-shadow:0 0 0 1px var(--line2), 0 0 40px #4cc3ff1a, 0 20px 60px #000; animation:pop .18s ease; }
@keyframes pop { from { transform:scale(.94); opacity:.4; } }
@keyframes up { from { transform:translateY(40px); opacity:.3; } }
#sheet header { display:flex; align-items:center; gap:8px; padding:12px 14px 10px 16px; font-weight:900; font-size:18px; position:relative; }
#sheet header::after { content:""; position:absolute; left:16px; right:16px; bottom:0; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--acc),var(--chak) 60%,transparent); opacity:.8; }
#sheet header::before { content:""; position:absolute; top:6px; left:50%; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:#ffffff26; }
#ptitle { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pclose, #pback { min-height:34px; padding:4px 14px; font-size:13px; border-radius:20px; }
#pback { font-size:18px; line-height:1; padding:0 12px 3px; }
#sheet .body { overflow-y:auto; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); touch-action:pan-y; -webkit-overflow-scrolling:touch; }
.sub { margin:14px 0 7px; font-weight:900; font-size:13px; color:var(--gold2); display:flex; align-items:center; gap:8px; } .sub::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line2),transparent); }
.sub:first-child { margin-top:2px; }
.item.card { --tc:#4c6bff; position:relative; background:linear-gradient(160deg,#1b2342,#121830); box-shadow:var(--frame), 0 4px 12px #0005; border-radius:var(--r); padding:10px 12px 10px 14px; margin-bottom:8px; font-size:13px; overflow:hidden; }
.item.card::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--tc); opacity:.85; }
.item.card.can { box-shadow:0 0 0 1px #35e08a99, 0 0 18px #35e08a2a, 0 4px 12px #0005; background:linear-gradient(160deg,#18332e,#11201f); }
